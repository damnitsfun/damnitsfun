name: Deploy — production

on:
  push:
    branches: [main]
    # A docs-only push goes to deploy-docs.yml instead: this workflow ends in a
    # systemctl restart, and the orchestrator archives every mid-hand table when
    # it boots. Fixing a typo is not worth a table.
    paths-ignore:
      - 'packages/docs-site/**'
      - '.github/workflows/deploy-docs*.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Deploy without re-running CI (emergency only)'
        type: boolean
        default: false

jobs:
  production:
    uses: ./.github/workflows/deploy-target.yml
    with:
      environment: production
      # Production always runs the full suite unless a human explicitly opts out
      # through workflow_dispatch.
      run_ci: ${{ !inputs.skip_tests }}
    secrets: inherit
