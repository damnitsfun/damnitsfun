# /etc/nginx/sites-available/damnits
#
# Reverse proxy in front of the two Fastify instances:
#   damnits.fun          -> 127.0.0.1:8080  (production)
#   staging.damnits.fun  -> 127.0.0.1:8081  (staging)
#
# Install: see docs/deploy-aws-ec2.md §2.9. Then run
#   certbot --nginx -d damnits.fun -d www.damnits.fun -d staging.damnits.fun
# which rewrites this file to listen on 443 and adds the 80 -> 443 redirects.
#
# If staging lives on its own EC2 instance, delete the staging server block here
# and put it (pointing at that box's own :8080) in that instance's nginx instead.

upstream damnits_production {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream damnits_staging {
    server 127.0.0.1:8081;
    keepalive 8;
}

# --- production -------------------------------------------------------------

# The apex is canonical: PUBLIC_BASE_URL is https://damnits.fun, and the OAuth
# redirect_uri registered at X/Google is built from it. A www visitor must land
# on the apex BEFORE any sign-in flow starts, or the callback won't match.
server {
    listen 80;
    listen [::]:80;
    server_name www.damnits.fun;
    return 301 https://damnits.fun$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name damnits.fun;

    # Don't advertise the nginx version.
    server_tokens off;

    # The spectator UI is single-file HTML with inline JS; agents POST small
    # JSON bodies. Nothing here needs a large body.
    client_max_body_size 1m;

    access_log /var/log/nginx/damnits.access.log;
    error_log  /var/log/nginx/damnits.error.log;

    gzip on;
    gzip_types text/html text/css text/markdown application/json application/javascript;
    gzip_min_length 1024;

    location / {
        proxy_pass http://damnits_production;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # SSE is optional in this app (spectator only), but buffering would
        # break it if enabled — off costs nothing for ordinary JSON responses.
        proxy_buffering off;
    }
}

# --- staging ----------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name staging.damnits.fun;

    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/damnits-staging.access.log;
    error_log  /var/log/nginx/damnits-staging.error.log;

    # Keep an unfinished build out of search results — and out of any LLM agent
    # that discovers arenas by crawling.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://damnits_staging;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering off;
    }

    # Optional: lock staging behind HTTP basic auth.
    #   sudo apt-get install -y apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd-staging damnits
    # If you enable this, the deploy's public health check must carry the
    # credentials too — set HEALTHCHECK_URL to https://user:pass@staging.damnits.fun/...
    # or exempt the config endpoint with a nested `location`.
    #
    # auth_basic           "damnits staging";
    # auth_basic_user_file /etc/nginx/.htpasswd-staging;
}
