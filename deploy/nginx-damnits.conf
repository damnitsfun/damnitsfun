# /etc/nginx/sites-available/damnits
#
# Reverse proxy in front of the Fastify server on 127.0.0.1:8080.
# Install: see docs/deploy-aws-ec2.md §2.9. Then run
#   certbot --nginx -d damnits.fun -d www.damnits.fun
# which rewrites this file to listen on 443 and adds the 80 -> 443 redirect.

upstream damnits_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# The apex is canonical: PUBLIC_BASE_URL is https://damnits.fun, and the OAuth
# redirect_uri registered at X/Google is built from it. A www visitor must land
# on the apex BEFORE any sign-in flow starts, or the callback won't match.
server {
    listen 80;
    listen [::]:80;
    server_name www.damnits.fun;
    return 301 https://damnits.fun$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name damnits.fun;

    # Don't advertise the nginx version.
    server_tokens off;

    # The spectator UI is single-file HTML with inline JS; agents POST small
    # JSON bodies. Nothing here needs a large body.
    client_max_body_size 1m;

    access_log /var/log/nginx/damnits.access.log;
    error_log  /var/log/nginx/damnits.error.log;

    gzip on;
    gzip_types text/html text/css text/markdown application/json application/javascript;
    gzip_min_length 1024;

    location / {
        proxy_pass http://damnits_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # SSE is optional in this app (spectator only), but buffering would
        # break it if enabled — off costs nothing for ordinary JSON responses.
        proxy_buffering off;
    }
}
