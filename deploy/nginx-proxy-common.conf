# Shared proxy headers, installed at /etc/nginx/damnits-proxy.conf.
#
# Extracted when the docs site (sub-spec 27) added six more proxied locations:
# the same eight lines written nine times is eight chances for one of them to
# drift. The app's own server blocks keep their inline copies — they also set
# per-location timeouts and buffering, and rewriting those was not this spec's
# job.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";
proxy_connect_timeout 5s;
proxy_read_timeout    60s;
proxy_buffering off;
