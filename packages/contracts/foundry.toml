# Foundry project for DamnitsEscrow (parent spec §2, §8).
#
# Foundry itself is rolling-release (run `foundryup`), but the compiler is pinned:
# floating solc across machines would change bytecode and make a deployed contract
# harder to verify.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# Pinned: solc 0.8.36. OpenZeppelin 5.6.1 requires a >=0.8.24 pragma floor, so the
# sources declare ^0.8.24 while compiling with this newer pinned release.
solc_version = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

verbosity = 2

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

# Source verification (sub-spec 23, D170). The submission portal turns our
# contract address into a BscScan link, so an unverified contract is the first
# thing a stranger sees — and BNB Chain's own evaluation guide names a verified
# contract outright.
#
# The key must be an ETHERSCAN V2 key (etherscan.io/myapikey); one key covers
# every chain, and legacy BscScan-issued keys are now rejected.
[etherscan]
bsc_testnet = { key = "${ETHERSCAN_API_KEY}", chain = 97, url = "https://api.etherscan.io/v2/api" }
bsc = { key = "${ETHERSCAN_API_KEY}", chain = 56, url = "https://api.etherscan.io/v2/api" }
